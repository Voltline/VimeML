[paths]
corpus_dir = "outputs/corpus-pilot"
output_dir = "artifacts/tokenizers/ja-unigram-16k-pilot"

[training]
model_type = "unigram"
vocab_size = 16384
character_coverage = 0.9995
byte_fallback = true
normalization_rule_name = "identity"
remove_extra_whitespaces = false
num_threads = 1
seed = 42
max_sentence_length = 8192

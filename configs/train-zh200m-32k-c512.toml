# zh-200m arm 32k-c512 (docs/zh-CN/training-zh-200m-plan.md): 32768 vocabulary, L14, context 512,
# fresh P1 web data for 1 epoch(s), seed 766903225. Everything else is the vimeml-tiny-zh-v1 recipe.
# 512 windows per update, the vimeml-tiny-zh-v1 batch size (about 17k supervised tokens).
stage = "zh-200m"
arm = "32k-c512"
architecture = "tiny_gpt_zh200m"
output_dir = "artifacts/models/tiny-zh200m-32k-c512-d1024"
log_dir = "runs/training/tiny-zh200m-32k-c512-d1024"
dataset_sha256 = "dee0bbd986b508da1c72dc356fd4b43b34c6cf216a30e9ee0d6f813dd238df72"

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/zh200m-32k-c512"

[model]
vocab_size = 32768
context_length = 512
d_model = 1024
n_heads = 16
n_layers = 14
d_ff = 2560
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 766903225
cpu_threads = 4
num_workers = 4
bucket_multiplier = 64
lm_batch = 512
lm_microbatch = 128
smoke_updates = 0
learning_rate = 0.0006
min_learning_rate = 0.00006
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 5000
checkpoint_every = 5000
validation_batch = 64

[tracking]
enabled = true
project = "vimeml"
group = "zh200m-desktop"
mode = "online"

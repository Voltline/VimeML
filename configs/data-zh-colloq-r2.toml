# Pinyin-conditioned data from the export-r2 colloquial paragraphs for round 2 of the v2-20m colloquial
# post-training (training-zh-colloq-plan.md, round 2): the r-type store beside zh-colloq-r2-12k in the c30/c40
# arms. Same builder, sample rules, tokenizer and Rime readings as data-zh-colloq-r1.toml. The input is
# zh_colloq.py export --name r2: export-r2 paragraphs selected like r1 (p_chat >= 0.7, plus fiction-like dialogue
# p_spoken >= 0.8, p_chat < 0.5), kept only if the LLM quality screen marked them ok, and without any overlap
# pattern of ime-pinyin-zh-colloq-v1 (development and test). Every paragraph is used: 30% plain, 70% pinyin.
export_dir = "outputs/zh-colloq/export-colloq-r2"
tokenizer = "artifacts/tokenizers/zh-v13/zh-unigram-12288/tokenizer.model"
tokenizer_sha256 = "68bd37c45bcb018b32b2eef5b241561ab5b6dc1b77c1c3aadcc1b41c4bf47e5a"
readings = "outputs/zh-readings/dict/vime_pinyin.dict.yaml"
readings_sha256 = "3a1654cd5ce20ecacd88046186c34ad87e748a494f7078f23c1ad15492eb0c8a"
output_dir = "artifacts/training-data/zh-colloq-r2-12k"
label = "zh-colloq-r2"
context_length = 128
workers = 7
row_groups_per_job = 2

web_plain_fraction = 0.3
web_pinyin_fraction = 0.7
chat_plain_fraction = 0
chat_pinyin_fraction = 0
validation_plain_fraction = 0.3
validation_pinyin_fraction = 0.7
validation_chat_plain_fraction = 0
validation_chat_pinyin_fraction = 0
plain_minimum_tokens = 8
listed_boost_probability = 0.5

[sample]
kind_weights = { full = 15, mixed = 15, initials = 15, error = 5 }
# [low, high, weight] in characters
target_lengths = [[2, 4, 15], [5, 10, 40], [11, 20, 35], [21, 30, 10]]
empty_context_probability = 0.10
max_context_characters = 96
apostrophe_probability = 0.3
keep_zh_probability = 0.15
mixed_abbreviation_range = [0.3, 0.7]
error_full_share = 0.6
error_listed_probability = 0.9
error_single_probability = 0.75
error_polyphone_share = 0.7
common_reading_share = 0.05

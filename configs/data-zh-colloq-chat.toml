# Pinyin-conditioned data from the screened external chat turns (douban, mmchat, tieba) for the v2-20m colloquial
# post-training (training-zh-colloq-plan.md): the second [[data.extra]] store of the c10/c20 arms. Same builder,
# sample rules, tokenizer and Rime readings as data-zh-colloq-r1.toml. The input is zh_colloq.py export-chat:
# chat-ext-v2 turns that passed the LLM quality screen, douban 800k : mmchat 600k : tieba 120k rows
# (tieba repeated about 2.35x under distinct dialogue keys), validation = up to 6000 screened heldout turns per
# source. One sample per turn, context only from inside the turn: 30% plain, 70% pinyin.
export_dir = "outputs/zh-colloq/export-colloq-chat"
tokenizer = "artifacts/tokenizers/zh-v13/zh-unigram-12288/tokenizer.model"
tokenizer_sha256 = "68bd37c45bcb018b32b2eef5b241561ab5b6dc1b77c1c3aadcc1b41c4bf47e5a"
readings = "outputs/zh-readings/dict/vime_pinyin.dict.yaml"
readings_sha256 = "3a1654cd5ce20ecacd88046186c34ad87e748a494f7078f23c1ad15492eb0c8a"
output_dir = "artifacts/training-data/zh-colloq-chat-12k"
label = "zh-colloq-chat"
context_length = 128
workers = 7
row_groups_per_job = 2

web_plain_fraction = 0
web_pinyin_fraction = 0
chat_plain_fraction = 0.3
chat_pinyin_fraction = 0.7
validation_plain_fraction = 0
validation_pinyin_fraction = 0
validation_chat_plain_fraction = 0.3
validation_chat_pinyin_fraction = 0.7
plain_minimum_tokens = 8
listed_boost_probability = 0.5

[sample]
kind_weights = { full = 15, mixed = 15, initials = 15, error = 5 }
# [low, high, weight] in characters
target_lengths = [[2, 4, 15], [5, 10, 40], [11, 20, 35], [21, 30, 10]]
empty_context_probability = 0.10
max_context_characters = 96
apostrophe_probability = 0.3
keep_zh_probability = 0.15
mixed_abbreviation_range = [0.3, 0.7]
error_full_share = 0.6
error_listed_probability = 0.9
error_single_probability = 0.75
error_polyphone_share = 0.7
common_reading_share = 0.05

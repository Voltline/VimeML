# ja-gen stage 2.3, 20M distillation arm kd-cont: continue the winning Stage 2.1 reading arm
# for 30,000 updates with the 200M joint reading model as a frozen teacher
# (0.5 * CE + 0.5 * KL at T = 1.0), peak LR 1.5e-4, warmup 1,000 (zh kd-cont recipe).
# Pin checkpoint_sha256 and teacher_sha256 once Stage 2.1 and 2.2 final.pt are complete.
stage = "ja-kana"
arm = "20m-kd-cont"
architecture = "tiny_gpt_zh13"
output_dir = "artifacts/models/ja-kana-20m-kd-cont"
log_dir = "runs/training/ja-kana-20m-kd-cont"

[initialization]
mode = "checkpoint"
checkpoint = "artifacts/models/ja-kana-20m-read-s1/final.pt"
checkpoint_sha256 = "PIN_AFTER_STAGE21"

[distillation]
teacher = "artifacts/models/ja-kana-200m-joint/final.pt"
teacher_sha256 = "PIN_AFTER_200M"
alpha = 0.5
temperature = 1.0

[data]
directory = "artifacts/training-data/ja-kana-v1-12k"
manifest_sha256 = "f5ec6fa71caa410029e9956ea0c4ab5d564eef2d042835660408b047cf6eeab1"
mix = { plain = 175, chat = 17, span = 192, sentence = 128 }

[model]
vocab_size = 12288
context_length = 128
d_model = 384
n_heads = 6
n_layers = 9
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 20261201
normalization = "per_kind"
cpu_threads = 4
num_workers = 4
max_steps = 30000
learning_rate = 0.00015
min_learning_rate = 1.5e-05
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 1000
keep_every = 6000
validation_batch = 256
validation_examples = 8192

[tracking]
enabled = true
project = "vimeml"
group = "ja-kana-20m-kd"
mode = "offline"

# ja-gen stage 3 colloquial post-training, arm colloq-c40-p85: identical to colloq-c40
# except [[data.extra]] points to the p_chat >= 0.85 subset store (ja-colloq-v1-p85-12k)
# drawn from the same 1/3 export as ja-colloq-v1-12k.
stage = "ja-kana"
arm = "20m-colloq-c40-p85"
architecture = "tiny_gpt_zh13"
output_dir = "artifacts/models/ja-kana-20m-colloq-c40-p85"
log_dir = "runs/training/ja-kana-20m-colloq-c40-p85"

[initialization]
mode = "checkpoint"
checkpoint = "artifacts/models/ja-kana-20m-kd-cont/final.pt"
checkpoint_sha256 = "5a44839657569b34dea57fae4a45a2050506f892a441e38715756727fe46a92f"

[distillation]
teacher = "artifacts/models/ja-kana-200m-joint/final.pt"
teacher_sha256 = "47721ddd357cb3a720d7108e4aeaa60f671d83167504fd9f649365b37d70a843"
alpha = 0.5
temperature = 1.0

[data]
directory = "artifacts/training-data/ja-kana-v1-12k"
manifest_sha256 = "f5ec6fa71caa410029e9956ea0c4ab5d564eef2d042835660408b047cf6eeab1"
mix = { plain = 97, chat = 17, span = 114, sentence = 76 }

[[data.extra]]
directory = "artifacts/training-data/ja-colloq-v1-p85-12k"
manifest_sha256 = "8cf9ab8e722749ed1e4181390b000902fc5a24f023bc1de93fdcbfb77e83a5bc"
mix = { plain = 78, span = 78, sentence = 52 }

[model]
vocab_size = 12288
context_length = 128
d_model = 384
n_heads = 6
n_layers = 9
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 20261205
normalization = "per_kind"
cpu_threads = 4
num_workers = 4
max_steps = 30000
learning_rate = 0.0001
min_learning_rate = 1e-05
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 1000
keep_every = 6000
validation_batch = 256
validation_examples = 8192

[tracking]
enabled = true
project = "vimeml"
group = "ja-kana-colloq"
mode = "offline"

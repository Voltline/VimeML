# Pinyin-conditioned data from export-r2 for round 3 of the v2-20m distillation (r1 + r2 mix in
# the trainer's [[data.extra]]). Same builder, sample rules, tokenizer and Rime readings as
# data-zh-pinyin.toml; export-r2 has no pools, no memorization probe and no LCCC, so every r2
# train web document is eligible and the label is new. Built on the cluster (export-r2 is there).
export_dir = "outputs/zh-corpus/export-r2"
tokenizer = "artifacts/tokenizers/zh-v13/zh-unigram-12288/tokenizer.model"
tokenizer_sha256 = "68bd37c45bcb018b32b2eef5b241561ab5b6dc1b77c1c3aadcc1b41c4bf47e5a"
# Rime dictionary Vime ships, generated locally by Vime's Scripts/build_rime_dicts.py
# <dir> --cache <cache> (pinned public sources; CC BY-SA data, never committed).
readings = "outputs/zh-readings/dict/vime_pinyin.dict.yaml"
readings_sha256 = "3a1654cd5ce20ecacd88046186c34ad87e748a494f7078f23c1ad15492eb0c8a"
output_dir = "artifacts/training-data/zh-pinyin-r2-12k"
label = "zh-pinyin-r2"
context_length = 128
workers = 16
row_groups_per_job = 8

# Document-level selection by doc_hash(label, id) over every export-r2 train web document.
# plain takes both scripts; pinyin takes simplified only, one sample per paragraph. Calibrated
# by a one-row-group run of these rules on export-r1 (16.5 s for 979K documents on 16 local
# workers): about 13M plain windows, 3.3M per pinyin kind and 1.1M error from r2's ~83M
# documents, 1.45 times r1 per pinyin kind, so round 3 reads under half a pass of it.
# The chat fractions are unused (no LCCC in export-r2); validation stays small because the
# trainer validates on the primary (r1) directory only.
web_plain_fraction = 0.008
web_pinyin_fraction = 0.008
chat_plain_fraction = 0
chat_pinyin_fraction = 0
validation_plain_fraction = 0.01
validation_pinyin_fraction = 0.01
validation_chat_plain_fraction = 0
validation_chat_pinyin_fraction = 0
plain_minimum_tokens = 8
# A paragraph containing a listed misreading becomes an error sample with this probability.
listed_boost_probability = 0.5

[sample]
kind_weights = { full = 15, mixed = 15, initials = 15, error = 5 }
# [low, high, weight] in characters
target_lengths = [[2, 4, 15], [5, 10, 40], [11, 20, 35], [21, 30, 10]]
empty_context_probability = 0.10
max_context_characters = 96
apostrophe_probability = 0.3
keep_zh_probability = 0.15
mixed_abbreviation_range = [0.3, 0.7]
error_full_share = 0.6
error_listed_probability = 0.9
error_single_probability = 0.75
error_polyphone_share = 0.7
common_reading_share = 0.05

# zh-200m arm 24k-c512-s3 (docs/zh-CN/training-zh-200m-plan.md): 24576 vocabulary, L14, context 512,
# fresh P1 web data for 1 epoch(s), seed 2109773078. Everything else is the vimeml-tiny-zh-v1 recipe.
# 128 windows x 512 tokens = 65,536 supervised tokens per update.
stage = "zh-200m"
arm = "24k-c512-s3"
architecture = "tiny_gpt_zh200m"
output_dir = "artifacts/models/tiny-zh200m-24k-c512-s3-d1024"
log_dir = "runs/training/tiny-zh200m-24k-c512-s3-d1024"
dataset_sha256 = ""

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/zh200m-24k-c512-s3"

[model]
vocab_size = 24576
context_length = 512
d_model = 1024
n_heads = 16
n_layers = 14
d_ff = 2560
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 2109773078
cpu_threads = 4
num_workers = 4
bucket_multiplier = 64
lm_batch = 128
lm_microbatch = 128
smoke_updates = 0
learning_rate = 0.0006
min_learning_rate = 0.00006
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 5000
checkpoint_every = 5000
validation_batch = 64

[tracking]
enabled = true
project = "vimeml"
group = "zh200m-desktop"
mode = "online"

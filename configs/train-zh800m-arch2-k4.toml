# zh-800m arch2 at k = 4 (docs/training-zh-800m-arch2-plan.md): arch1's data, mixture, pinyin stores,
# seed and token budget (configs/train-zh800m-12k-c512-pinyin.toml) with the arch2 model (d1792/L23,
# Q28/KV7, RoPE, QK-norm; 776,524,928 parameters), training rows packed to 2048 tokens, and the batch
# scaled by k: lm_batch 2048 x 4, pinyin mix x 4, warmup 2000 / 4,
# bucket_multiplier 64 / 4; checkpoint, eval and log intervals divided by k (equal in tokens).
# Peak LR stays at arch1's 3e-4 (no sqrt(k)): the 200M batch precheck control round (2026-11-20) passed 4x only
# at 1x's learning rate (4x-lr), so k = 4 at arch1's LR; k = 8 is not tried.
stage = "zh-800m-arch2"
arm = "12k-c512"
architecture = "tiny_gpt_zh800m_arch2"
output_dir = "artifacts/models/tiny-zh800m-arch2-k4"
log_dir = "runs/training/tiny-zh800m-arch2-k4"
dataset_sha256 = "985aecea96de26a141b11ed7378ee60f04dcf59e307feecb9af8c028ca675d32"

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/zh800m-12k-c512"

[pinyin]
directory = "artifacts/training-data/zh-pinyin-pt-12k"
manifest_sha256 = "562e0340234f9040ad949e9f9730f67d4fc18a470a543a02f1c22ce858c9c39b"
mix = { full = 384, mixed = 512, initials = 448, error = 192 }
validation_examples = 4096

[model]
vocab_size = 12288
context_length = 512
d_model = 1792
n_heads = 28
n_kv_heads = 7
n_layers = 23
d_ff = 4608
rope_theta = 10000.0
norm_eps = 0.00001
pack_length = 2048
dropout = 0.0

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 1816189249
cpu_threads = 4
num_workers = 4
bucket_multiplier = 16
lm_batch = 8192
lm_microbatch = 64
smoke_updates = 0
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 500
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 25
eval_every = 1250
checkpoint_every = 500
validation_batch = 64

[tracking]
enabled = true
project = "vimeml"
group = "zh800m-arch2"
mode = "online"

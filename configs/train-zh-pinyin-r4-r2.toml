# zh v2-20m distillation round 4, arm r4-r2: r4 started from r2-cont (final.pt) instead of kd-cont. Paired with kd-cont (same start, 200M teacher).
# Teacher: the 800M arch1 final.pt (step 1,198,964).
stage = "zh-pinyin-s1"
architecture = "tiny_gpt_zh13"
output_dir = "artifacts/models/tiny-zh13-12k-pinyin-r4-r2"
log_dir = "runs/training/tiny-zh13-12k-pinyin-r4-r2"
arm = "pinyin-r4-r2"

[initialization]
mode = "checkpoint"
checkpoint = "artifacts/models/tiny-zh13-12k-pinyin-r2-cont/final.pt"
checkpoint_sha256 = "fc5a33b5552258ced9e7da6d1a2016db30d227779c071df0470b7582a64ad8e0"

[distillation]
teacher = "artifacts/models/tiny-zh800m-12k-pinyin-pt-d1536/final.pt"
teacher_sha256 = "ec3e90df4c113f84990918a2e7d3c54cb5affd64c325100a0d4121b58f85d80f"
alpha = 0.5
temperature = 1.0

[data]
directory = "artifacts/training-data/zh-pinyin-v2-12k"
manifest_sha256 = "c449439ba6af405fb4a907c8fcb9e753d4c8eb73428cfe839e9eac0f05cea472"
mix = { plain = 160, full = 96, mixed = 128, initials = 96, error = 32 }

[model]
vocab_size = 12288
context_length = 128
d_model = 384
n_heads = 6
n_layers = 9
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 20261117
normalization = "per_kind"
cpu_threads = 4
num_workers = 6
max_steps = 30000
learning_rate = 0.0001
min_learning_rate = 0.00001
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 1000
keep_every = 6000
validation_batch = 256
validation_plain_examples = 8192

[tracking]
enabled = true
project = "vimeml"
group = "zh-pinyin-kd"
mode = "online"

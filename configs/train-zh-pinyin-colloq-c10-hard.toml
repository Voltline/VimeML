# zh v2-20m colloquial post-training (training-zh-colloq-plan.md), arm colloq-c10-hard: colloq-c10's data, but the two colloquial directories train on cross-entropy
# alone (ce_only = true): the teacher, which never saw this text, gives no soft labels there; the r1 base
# keeps the distilled loss.
stage = "zh-pinyin-s1"
architecture = "tiny_gpt_zh13"
output_dir = "artifacts/models/tiny-zh13-12k-pinyin-colloq-c10-hard"
log_dir = "runs/training/tiny-zh13-12k-pinyin-colloq-c10-hard"
arm = "pinyin-colloq-c10-hard"

[initialization]
mode = "checkpoint"
checkpoint = "artifacts/models/tiny-zh13-12k-pinyin-kd-cont/final.pt"
checkpoint_sha256 = "412aee1d1c2d73c9f2ff52533188055e4655575472fe3be136e048fd240268a4"

[distillation]
teacher = "artifacts/models/tiny-zh200m-12k-pinyin-pt-d1024/final.pt"
teacher_sha256 = "90e48fe4cbaeacf5c58774ded243e57d94c86923a51d191555fbbfc7954150f8"
alpha = 0.5
temperature = 1.0

[data]
directory = "artifacts/training-data/zh-pinyin-v2-12k"
manifest_sha256 = "c449439ba6af405fb4a907c8fcb9e753d4c8eb73428cfe839e9eac0f05cea472"
mix = { plain = 144, full = 86, mixed = 115, initials = 86, error = 29 }

[[data.extra]]
directory = "artifacts/training-data/zh-colloq-r1-12k"
manifest_sha256 = "1dea73995a85433afa37f5289b9fc78df49d183ed2fe6e5bfec24ff8170bc67e"
mix = { plain = 10, full = 6, mixed = 8, initials = 6, error = 2 }
ce_only = true

[[data.extra]]
directory = "artifacts/training-data/zh-colloq-chat-12k"
manifest_sha256 = "d97cb59d044daac1631d7f12bf6a02400615597727a7df87c62e29db47da68dc"
mix = { plain = 6, full = 4, mixed = 5, initials = 4, error = 1 }
ce_only = true

[model]
vocab_size = 12288
context_length = 128
d_model = 384
n_heads = 6
n_layers = 9
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 20261122
normalization = "per_kind"
cpu_threads = 4
num_workers = 6
max_steps = 30000
learning_rate = 0.0001
min_learning_rate = 0.00001
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 1000
keep_every = 6000
validation_batch = 256
validation_plain_examples = 8192

[tracking]
enabled = true
project = "vimeml"
group = "zh-colloq"
mode = "online"

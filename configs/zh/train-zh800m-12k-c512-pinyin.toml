# zh-800m with joint pinyin pretraining (deviation of 2026-11-17 in docs/zh-CN/zh/training/training-zh-800m-plan.md):
# configs/zh/train-zh800m-12k-c512.toml unchanged (shape, mixture, seed, schedule, 2048 windows per update),
# plus the pinyin stores of the 12K joint-pinyin 200M (Rime readings, export-r1 P1 + LCCC). Every update
# adds 384 pinyin samples, twice the 200M's 192 in the same proportions, so the stores are read about
# 1.1-1.5 times over ~1M updates instead of 2.3-2.9 times at four times the 200M count; pinyin then
# carries 384 / 2432 = 15.8% of the per_kind loss (200M: 192 / 704 = 27.3%).
stage = "zh-800m"
arm = "12k-c512"
architecture = "tiny_gpt_zh800m"
output_dir = "artifacts/models/tiny-zh800m-12k-pinyin-pt-d1536"
log_dir = "runs/training/tiny-zh800m-12k-pinyin-pt-d1536"
dataset_sha256 = "985aecea96de26a141b11ed7378ee60f04dcf59e307feecb9af8c028ca675d32"

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/zh800m-12k-c512"

[pinyin]
directory = "artifacts/training-data/zh-pinyin-pt-12k"
manifest_sha256 = "562e0340234f9040ad949e9f9730f67d4fc18a470a543a02f1c22ce858c9c39b"
mix = { full = 96, mixed = 128, initials = 112, error = 48 }
validation_examples = 4096

[model]
vocab_size = 12288
context_length = 512
d_model = 1536
n_heads = 24
n_layers = 27
d_ff = 4096
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 1816189249
cpu_threads = 4
num_workers = 4
bucket_multiplier = 64
lm_batch = 2048
lm_microbatch = 64
smoke_updates = 0
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 2000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 5000
checkpoint_every = 2000
validation_batch = 64

[tracking]
enabled = true
project = "vimeml"
group = "zh800m-pinyin-pt"
mode = "online"

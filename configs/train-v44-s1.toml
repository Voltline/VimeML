# V4.4 ablation arm s1: the V4.2 recipe with one change, replicate seed 1 of 3.
# dataset_sha256 is the LF manifest that prepare_v44.py must reproduce exactly.
stage = "v4.4"
arm = "s1"
architecture = "tiny_gpt_v4"
token_dir = "artifacts/token-data/corpus-v4-8k"
index_dir = "artifacts/training-data/corpus-v4-c128"
tokenizer_dir = "artifacts/tokenizers/v4-a/ja-unigram-8192"
output_dir = "artifacts/models/tiny-ja-v44-s1-e8k-d384-l7"
log_dir = "runs/training/tiny-ja-v44-s1-e8k-d384-l7"
dataset_sha256 = "d375bd20426327658bc042f231b35602fc5a074c7b9bc81ddcf5fc5b92f4a2c1"

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/corpus-v44-s1-c128"
chat_fraction = 0.05

[model]
vocab_size = 8192
context_length = 128
d_model = 384
n_heads = 6
n_layers = 7
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 137218780
cpu_threads = 4
num_workers = 4
bucket_multiplier = 64
lm_batch = 512
lm_microbatch = 512
epochs = 20
smoke_updates = 0
learning_rate = 0.0006
min_learning_rate = 0.00006
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 5000
validation_batch = 256

[tracking]
enabled = true
project = "vimeml"
group = "v44-ablation"
mode = "online"

# arch2 batch precheck (docs/training-zh-800m-arch2-plan.md, Larger updates): the 12K joint-pinyin 200M
# recipe (configs/train-zh200m-12k-pinyin-pt.toml) on its first 10% of updates as a complete short run,
# at 1x the batch: lm_batch 512, pinyin mix x1, peak LR 6e-4 x sqrt(1), warmup 1000 / 1,
# bucket_multiplier 64 / 1 (same length pools and data order). Arms 1x/4x/8x share data, order and seed.
stage = "zh-pinyin-pt"
arm = "pinyin-pt-200m-batch-1x"
architecture = "tiny_gpt_zh200m"
output_dir = "artifacts/models/tiny-zh200m-batch-precheck-1x"
log_dir = "runs/training/tiny-zh200m-batch-precheck-1x"
dataset_sha256 = "03bd8d21cf30b21c160362aa13bddbb47b59ee6657a024df38aa03adc94fec1d"

[initialization]
mode = "random"

[data_mixture]
directory = "artifacts/training-data/zh13-12k-fresh-s1-c128"

[pinyin]
plain_arm = "12k-fresh-s1"
directory = "artifacts/training-data/zh-pinyin-pt-12k"
manifest_sha256 = "562e0340234f9040ad949e9f9730f67d4fc18a470a543a02f1c22ce858c9c39b"
mix = { full = 48, mixed = 64, initials = 56, error = 24 }
validation_examples = 4096
[model]
vocab_size = 12288
context_length = 128
d_model = 1024
n_heads = 16
n_layers = 15
d_ff = 2560
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 1591996171
cpu_threads = 4
num_workers = 4
bucket_multiplier = 64
budget_fraction = 0.1
lm_batch = 512
lm_microbatch = 512
smoke_updates = 0
learning_rate = 0.0006
min_learning_rate = 0.00006
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 5000
checkpoint_every = 5000
validation_batch = 256

[tracking]
enabled = true
project = "vimeml"
group = "zh200m-batch-precheck"
mode = "online"

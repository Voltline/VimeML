[inputs]
fineweb_glob = "datasets/fineweb-2-edu-japanese/*.parquet"
tatoeba_path = "datasets/Tatoeba/jpn_sentences.tsv"
# These samples helped tune the pipeline. Keep their document groups in train.
# Their DS labels are NOT used to filter new documents in rules_only mode.
calibration_review = "outputs/review/review.json"

[build]
quality_mode = "rules_only"
output_dir = "outputs/corpus-smoke"
seed = 42
batch_size = 1024
max_join_chars = 2048
# Head selection is for a smoke test, not representative quality measurement.
# Set 0 to read all documents later, after checking the smoke results.
fineweb_documents_per_shard = 200
tatoeba_documents = 200

[split]
train = 0.98
validation = 0.01
test = 0.01

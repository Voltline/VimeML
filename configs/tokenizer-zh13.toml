# vimeml-tiny-zh-v1 formal tokenizers (docs/zh-CN/training-zh-v1-plan.md).
# Same sampling and SentencePiece settings as the vocabulary probe
# (docs/zh-CN/reports/zh-v1-20261106/tokenizer-vocab.md), on the frozen export,
# plus a newline user symbol and three reserved control symbols.
export_dir = "outputs/zh-corpus/export-r1"
output_dir = "artifacts/tokenizers/zh-v13"
seed = 20261106
web_lines = 1500000
chat_lines = 80000
# Web and review files are pooled per stage-a shard, equal quota per shard, row groups
# drawn with weight = documents (src/vimeml/tokenizer/zh13.py sample_shard).
max_line_bytes = 16384
vocab_sizes = [8192, 12288]
character_coverage = 0.9995
# Control symbols are never produced from text, so a literal "<CTX>" in a web page
# stays ordinary text; they are reserved for a later conversion task.
control_symbols = ["<CTX>", "<READ>", "<OUT>"]
user_defined_symbols = ["\n"]
num_threads = 16

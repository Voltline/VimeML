# zh v2-20m colloquial post-training (training-zh-colloq-plan.md), arm colloq-c20: as colloq-c10 with the colloquial share doubled to 104 of 512 (about 20%):
# 64 export-r1 colloquial paragraphs + 40 chat turns per update; per-kind totals unchanged.
stage = "zh-pinyin-s1"
architecture = "tiny_gpt_zh13"
output_dir = "artifacts/models/tiny-zh13-12k-pinyin-colloq-c20"
log_dir = "runs/training/tiny-zh13-12k-pinyin-colloq-c20"
arm = "pinyin-colloq-c20"

[initialization]
mode = "checkpoint"
checkpoint = "artifacts/models/tiny-zh13-12k-pinyin-kd-cont/final.pt"
checkpoint_sha256 = "412aee1d1c2d73c9f2ff52533188055e4655575472fe3be136e048fd240268a4"

[distillation]
teacher = "artifacts/models/tiny-zh200m-12k-pinyin-pt-d1024/final.pt"
teacher_sha256 = "90e48fe4cbaeacf5c58774ded243e57d94c86923a51d191555fbbfc7954150f8"
alpha = 0.5
temperature = 1.0

[data]
directory = "artifacts/training-data/zh-pinyin-v2-12k"
manifest_sha256 = "c449439ba6af405fb4a907c8fcb9e753d4c8eb73428cfe839e9eac0f05cea472"
mix = { plain = 128, full = 76, mixed = 102, initials = 76, error = 26 }

[[data.extra]]
directory = "artifacts/training-data/zh-colloq-r1-12k"
manifest_sha256 = "1dea73995a85433afa37f5289b9fc78df49d183ed2fe6e5bfec24ff8170bc67e"
mix = { plain = 20, full = 12, mixed = 16, initials = 12, error = 4 }

[[data.extra]]
directory = "artifacts/training-data/zh-colloq-chat-12k"
manifest_sha256 = "PENDING_CHAT_STORE_MANIFEST_SHA256"
mix = { plain = 12, full = 8, mixed = 10, initials = 8, error = 2 }

[model]
vocab_size = 12288
context_length = 128
d_model = 384
n_heads = 6
n_layers = 9
d_ff = 960
dropout = 0.0
norm = "rmsnorm"
norm_eps = 0.00001
activation = "swiglu"
bias = false
tie_embeddings = true
position_embedding = "learned"

[runtime]
compile_backbone = true

[training]
device = "cuda"
precision = "bf16"
seed = 20261122
normalization = "per_kind"
cpu_threads = 4
num_workers = 6
max_steps = 30000
learning_rate = 0.0001
min_learning_rate = 0.00001
warmup_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
prefix_crop_probability = 0.30
log_every = 100
eval_every = 2000
checkpoint_every = 1000
keep_every = 6000
validation_batch = 256
validation_plain_examples = 8192

[tracking]
enabled = true
project = "vimeml"
group = "zh-colloq"
mode = "online"
